<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Prism Drift</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0b0c1e;
  --cyan: #00f0ff;
  --magenta: #ff00a0;
  --gold: #ffd700;
  --glass-bg: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.12);
  --glass-blur: 20px;
  --text: #e0e6ff;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Space Mono', monospace;
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

canvas { display: block; width: 100%; height: 100%; }

#game-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
}

/* ── Glass Panel Base ── */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
}

/* ── Overlay UI Layer ── */
#ui-layer {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 10;
  pointer-events: none;
}
#ui-layer > * { pointer-events: auto; }

/* ── Title Screen ── */
#title-screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 24px;
  transition: opacity 0.8s ease, transform 0.8s ease;
}
#title-screen.hidden {
  opacity: 0; transform: scale(1.05);
  pointer-events: none;
}

.game-title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(2.5rem, 8vw, 5rem);
  font-weight: 900;
  letter-spacing: 0.1em;
  background: linear-gradient(135deg, var(--cyan), var(--magenta), var(--gold));
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 4s ease infinite;
  text-shadow: none;
  filter: drop-shadow(0 0 30px rgba(0,240,255,0.3));
  text-align: center;
}
@keyframes gradientShift {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.subtitle {
  font-family: 'Space Mono', monospace;
  font-size: clamp(0.7rem, 2vw, 1rem);
  color: rgba(224,230,255,0.5);
  letter-spacing: 0.3em;
  text-transform: uppercase;
}

.glass-btn {
  position: relative;
  padding: 16px 48px;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.9rem, 2.5vw, 1.2rem);
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--cyan);
  background: rgba(0,240,255,0.06);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(0,240,255,0.25);
  border-radius: 12px;
  cursor: pointer;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
  box-shadow: 0 0 20px rgba(0,240,255,0.1), inset 0 1px 0 rgba(255,255,255,0.1);
  outline: none;
}
.glass-btn:hover {
  transform: scale(1.06);
  border-color: rgba(0,240,255,0.5);
  box-shadow: 0 0 40px rgba(0,240,255,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
  background: rgba(0,240,255,0.1);
}
.glass-btn:active {
  transform: scale(0.97);
}
.glass-btn .ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(0,240,255,0.3);
  transform: scale(0);
  animation: rippleAnim 0.6s ease-out forwards;
  pointer-events: none;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}

.high-score-display {
  font-size: clamp(0.65rem, 1.8vw, 0.85rem);
  color: rgba(255,215,0,0.7);
  letter-spacing: 0.15em;
}

.controls-hint {
  font-size: clamp(0.55rem, 1.5vw, 0.75rem);
  color: rgba(224,230,255,0.3);
  text-align: center;
  line-height: 1.8;
  max-width: 400px;
}

/* ── HUD ── */
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  padding: clamp(12px, 3vw, 24px);
  display: flex; justify-content: space-between; align-items: flex-start;
  transition: opacity 0.5s ease;
}
#hud.hidden { opacity: 0; pointer-events: none; }

.hud-score {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.4rem, 5vw, 2.4rem);
  font-weight: 800;
  color: #fff;
  text-shadow: 0 0 20px rgba(0,240,255,0.5);
  transition: text-shadow 0.3s;
}
.hud-score.pulse {
  text-shadow: 0 0 40px rgba(255,215,0,0.8);
}

.hud-multiplier {
  display: inline-block;
  padding: 4px 14px;
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(0.7rem, 2vw, 1rem);
  font-weight: 700;
  color: var(--gold);
  background: rgba(255,215,0,0.08);
  border: 1px solid rgba(255,215,0,0.25);
  border-radius: 8px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

.hud-right {
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
}

.hud-distance {
  font-size: clamp(0.6rem, 1.6vw, 0.8rem);
  color: rgba(224,230,255,0.5);
  letter-spacing: 0.1em;
}

/* ── Boost Bar ── */
#boost-bar-container {
  position: absolute;
  bottom: clamp(20px, 5vw, 40px);
  left: 50%; transform: translateX(-50%);
  width: clamp(120px, 30vw, 220px);
  height: 8px;
  border-radius: 4px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  overflow: hidden;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: opacity 0.5s;
}
#boost-bar-container.hidden { opacity: 0; }
#boost-bar {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, var(--cyan), var(--magenta));
  border-radius: 4px;
  transition: width 0.1s linear;
  box-shadow: 0 0 12px rgba(0,240,255,0.4);
}

/* ── Game Over ── */
#game-over {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(11,12,30,0.5);
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
}
#game-over.visible {
  opacity: 1; pointer-events: auto;
}
.game-over-card {
  padding: clamp(24px, 5vw, 48px);
  min-width: clamp(260px, 60vw, 420px);
  text-align: center;
  display: flex; flex-direction: column; gap: 16px;
  animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  transform: translateY(40px);
}
@keyframes slideUp {
  to { transform: translateY(0); }
}
.game-over-card h2 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.3rem, 4vw, 2rem);
  font-weight: 800;
  background: linear-gradient(135deg, var(--cyan), var(--magenta));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.stat-label { font-size: 0.8rem; color: rgba(224,230,255,0.5); }
.stat-value {
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 1rem;
}
.stat-value.gold { color: var(--gold); }

.new-best {
  font-family: 'Orbitron', sans-serif;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.2em;
  animation: pulseGlow 1s ease infinite;
}
@keyframes pulseGlow {
  0%,100% { opacity: 0.7; text-shadow: 0 0 10px rgba(255,215,0,0.3); }
  50% { opacity: 1; text-shadow: 0 0 25px rgba(255,215,0,0.6); }
}

/* ── Zone Indicator ── */
#zone-indicator {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.2rem, 4vw, 2rem);
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #fff;
  opacity: 0;
  text-shadow: 0 0 30px rgba(0,240,255,0.6);
  transition: opacity 0.5s ease;
  pointer-events: none;
}
#zone-indicator.show {
  animation: zoneFlash 2.5s ease forwards;
}
@keyframes zoneFlash {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(0.8); }
  15% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); }
  70% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.1); }
}

/* ── Particle Burst on Click ── */
.click-particle {
  position: fixed;
  width: 4px; height: 4px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 100;
  animation: particleFly 0.6s ease-out forwards;
}
@keyframes particleFly {
  0% { opacity: 1; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
}

/* ── WebGL Fallback ── */
#no-webgl {
  position: fixed; inset: 0;
  display: none;
  align-items: center; justify-content: center;
  background: var(--bg);
  z-index: 9999;
  text-align: center;
  padding: 40px;
}
#no-webgl h1 { font-family: 'Orbitron', sans-serif; color: var(--cyan); margin-bottom: 16px; }
#no-webgl p { color: rgba(224,230,255,0.6); }

/* ── Mobile swipe hints ── */
.swipe-hint {
  position: absolute;
  bottom: clamp(50px, 10vw, 80px);
  font-size: 0.65rem;
  color: rgba(224,230,255,0.2);
  letter-spacing: 0.15em;
}
.swipe-hint.left { left: 20px; }
.swipe-hint.right { right: 20px; }

/* ── Loading ── */
#loading-screen {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--bg);
  z-index: 9999;
  gap: 20px;
  transition: opacity 0.8s ease;
}
#loading-screen.fade-out {
  opacity: 0; pointer-events: none;
}
.loading-bar-track {
  width: clamp(200px, 50vw, 350px);
  height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.loading-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--cyan), var(--magenta));
  border-radius: 2px;
  transition: width 0.3s ease;
}
.loading-text {
  font-size: 0.7rem;
  color: rgba(224,230,255,0.4);
  letter-spacing: 0.2em;
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="game-title" style="font-size:clamp(1.5rem,5vw,3rem)">PRISM DRIFT</div>
  <div class="loading-bar-track"><div class="loading-bar-fill" id="loading-fill"></div></div>

<div id="no-webgl">

<div id="ui-layer">
  <!-- Title Screen -->

      </div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

// ═══════════════════════════════════════════
// AUDIO ENGINE (Procedural Web Audio)
// ═══════════════════════════════════════════
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.droneGain = null;
    this.droneOsc = null;
    this.droneFilter = null;
    this.initialized = false;
  }
  init() {
    if (this.initialized) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.3;
      this.masterGain.connect(this.ctx.destination);
      // Ambient drone
      this.droneGain = this.ctx.createGain();
      this.droneGain.gain.value = 0;
      this.droneFilter = this.ctx.createBiquadFilter();
      this.droneFilter.type = 'lowpass';
      this.droneFilter.frequency.value = 200;
      this.droneOsc = this.ctx.createOscillator();
      this.droneOsc.type = 'sawtooth';
      this.droneOsc.frequency.value = 55;
      const droneOsc2 = this.ctx.createOscillator();
      droneOsc2.type = 'sine';
      droneOsc2.frequency.value = 110;
      this.droneOsc.connect(this.droneFilter);
      droneOsc2.connect(this.droneFilter);
      this.droneFilter.connect(this.droneGain);
      this.droneGain.connect(this.masterGain);
      this.droneOsc.start();
      droneOsc2.start();
      this.initialized = true;
    } catch(e) { console.warn('Audio init failed', e); }
  }
  setDroneIntensity(t) {
    if (!this.initialized) return;
    const v = Math.min(t, 1) * 0.12;
    this.droneGain.gain.linearRampToValueAtTime(v, this.ctx.currentTime + 0.1);
    this.droneFilter.frequency.linearRampToValueAtTime(200 + t * 800, this.ctx.currentTime + 0.1);
  }
  playPickup() {
    if (!this.initialized) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1760, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.2);
    osc.connect(gain).connect(this.masterGain);
    osc.start(); osc.stop(this.ctx.currentTime + 0.2);
  }
  playGate() {
    if (!this.initialized) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(440, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15);
    osc.frequency.exponentialRampToValueAtTime(1320, this.ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
    osc.connect(gain).connect(this.masterGain);
    osc.start(); osc.stop(this.ctx.currentTime + 0.4);
  }
  playCrash() {
    if (!this.initialized) return;
    const bufferSize = this.ctx.sampleRate * 0.3;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i/bufferSize);
    const source = this.ctx.createBufferSource();
    source.buffer = buffer;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 600;
    source.connect(filter).connect(gain).connect(this.masterGain);
    source.start();
  }
  playClick() {
    if (!this.initialized) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 600;
    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
    osc.connect(gain).connect(this.masterGain);
    osc.start(); osc.stop(this.ctx.currentTime + 0.08);
  }
  playBoost() {
    if (!this.initialized) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
    osc.connect(gain).connect(this.masterGain);
    osc.start(); osc.stop(this.ctx.currentTime + 0.3);
  }
  stopDrone() {
    if (!this.initialized) return;
    this.droneGain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
  }
}

const audio = new AudioEngine();

// ═══════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════
const State = {
  phase: 'title', // title | playing | dying | dead
  score: 0,
  displayScore: 0,
  distance: 0,
  shards: 0,
  multiplier: 1.0,
  speed: 18,
  baseSpeed: 18,
  maxSpeed: 55,
  boost: 1.0,
  boosting: false,
  playerAngle: 0,
  targetAngle: 0,
  playerRadius: 3.2,
  invulnerable: 0,
  highScore: parseInt(localStorage.getItem('prismDriftHigh') || '0'),
  zone: 0,
  zoneNames: ['GLASS FOREST', 'NEON VOID', 'OBSIDIAN ABYSS', 'QUANTUM RIFT', 'INFINITE PRISM'],
  zoneColors: [
    { primary: new THREE.Color(0x00f0ff), secondary: new THREE.Color(0xff00a0), fog: new THREE.Color(0x050818) },
    { primary: new THREE.Color(0x00ff88), secondary: new THREE.Color(0xffaa00), fog: new THREE.Color(0x081005) },
    { primary: new THREE.Color(0xff3366), secondary: new THREE.Color(0x6633ff), fog: new THREE.Color(0x100508) },
    { primary: new THREE.Color(0xffdd00), secondary: new THREE.Color(0x00ddff), fog: new THREE.Color(0x101008) },
    { primary: new THREE.Color(0xff00ff), secondary: new THREE.Color(0x00ffff), fog: new THREE.Color(0x0a050f) },
  ],
  lastZoneChange: 0,
};

// ═══════════════════════════════════════════
// RENDERER SETUP
// ═══════════════════════════════════════════
const canvas = document.getElementById('game-canvas');
let renderer, scene, camera, composer, bloomPass, clock;
let tunnelSegments = [], obstacles = [], pickups = [], gateRings = [];
let playerMesh, shieldMesh;
let tunnelGroup, obstaclePool = [], pickupPool = [], gatePool = [];
let particleSystem, particleMaterial;
const TUNNEL_RADIUS = 5;
const SEGMENT_LENGTH = 12;
const VISIBLE_SEGMENTS = 25;
const SPAWN_AHEAD = VISIBLE_SEGMENTS * SEGMENT_LENGTH;

// Check WebGL2
function checkWebGL() {
  const gl = canvas.getContext('webgl2');
  if (!gl) {
    document.getElementById('no-webgl').style.display = 'flex';
    document.getElementById('loading-screen').style.display = 'none';
    return false;
  }
  return true;
}

if (!checkWebGL()) throw new Error('No WebGL2');

function initRenderer() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050818, 0.012);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
  camera.position.set(0, 0, 0);

  clock = new THREE.Clock();

  // Post-processing
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));

  bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    0.8, 0.4, 0.85
  );
  composer.addPass(bloomPass);

  // Vignette + Chromatic Aberration
  const vignetteShader = {
    uniforms: {
      tDiffuse: { value: null },
      intensity: { value: 0.4 },
      chromaticAberration: { value: 0.0 },
    },
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float intensity;
      uniform float chromaticAberration;
      varying vec2 vUv;
      void main(){
        vec2 uv = vUv;
        vec2 center = uv - 0.5;
        float dist = length(center);
        // Chromatic aberration
        float ca = chromaticAberration * dist;
        float r = texture2D(tDiffuse, uv + center * ca).r;
        float g = texture2D(tDiffuse, uv).g;
        float b = texture2D(tDiffuse, uv - center * ca).b;
        vec3 color = vec3(r, g, b);
        // Vignette
        float vig = 1.0 - smoothstep(0.4, 0.85, dist * intensity * 2.0);
        gl_FragColor = vec4(color * vig, 1.0);
      }
    `
  };
  const vignettePass = new ShaderPass(vignetteShader);
  vignettePass.uniforms.intensity.value = 0.5;
  composer.addPass(vignettePass);
  window._vignettePass = vignettePass;

  window.addEventListener('resize', onResize);
}

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
}

// ENVIRONMENT MAP (Procedural)
// ═══════════════════════════════════════════
function createEnvMap() {
  const size = 128;
  const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(size);
  // Create a simple procedural environment using a scene with colored meshes
  const envScene = new THREE.Scene();
  // Dark background with colored accents
  const colors = [0x00f0ff, 0xff00a0, 0x6633ff, 0x00ff88, 0xffaa00, 0xff3366];
  for (let i = 0; i < 40; i++) {
    const geo = new THREE.IcosahedronGeometry(2 + Math.random() * 5, 0);
    const mat = new THREE.MeshBasicMaterial({ color: colors[i % colors.length], opacity: 0.3, transparent: true });
    const mesh = new THREE.Mesh(geo, mat);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.random() * Math.PI;
    const r = 30 + Math.random() * 40;
    mesh.position.set(r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
    envScene.add(mesh);
  }
  const cubeCamera = new THREE.CubeCamera(0.1, 100, cubeRenderTarget);
  cubeCamera.update(renderer, envScene);
  return cubeRenderTarget.texture;
}

let glassMaterial, tunnelMaterial, shardMaterial, gateMaterial, envMap;

function createMaterials() {
  envMap = createEnvMap();

  glassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x88ccff,
    metalness: 0.1,
    roughness: 0.05,
    transmission: 0.9,
    thickness: 0.5,
    envMap: envMap,
    envMapIntensity: 1.5,
    transparent: true,
    opacity: 0.6,
    side: THREE.DoubleSide,
    flatShading: true,
  });

  tunnelMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uColor1: { value: new THREE.Color(0x00f0ff) },
      uColor2: { value: new THREE.Color(0xff00a0) },
      uSpeed: { value: 0 },
      uPlayerZ: { value: 0 },
    },
    vertexShader: `
      varying vec3 vPosition;
      varying vec3 vNormal;
      varying vec2 vUv;
      void main() {
        vPosition = position;
        vNormal = normal;
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform vec3 uColor1;
      uniform vec3 uColor2;
      uniform float uSpeed;
      uniform float uPlayerZ;
      varying vec3 vPosition;
      varying vec3 vNormal;
      varying vec2 vUv;

      void main() {
        float z = vPosition.z - uPlayerZ;
        // Grid pattern
        float gridX = abs(sin(vUv.x * 24.0));
        float gridZ = abs(sin((vPosition.z + uTime * uSpeed * 0.3) * 0.8));
        float grid = smoothstep(0.95, 1.0, max(gridX, gridZ));

        // Base color with depth
        float depth = smoothstep(-20.0, -280.0, z);
        vec3 baseColor = mix(uColor1, uColor2, depth) * 0.08;

        // Edge glow (Fresnel-like)
        float fresnel = pow(1.0 - abs(dot(normalize(vNormal), vec3(0.0, 0.0, 1.0))), 2.0);
        vec3 edgeColor = mix(uColor1, uColor2, sin(uTime * 0.5) * 0.5 + 0.5);

        vec3 color = baseColor + grid * edgeColor * 0.4 + fresnel * edgeColor * 0.15;

        // Distance fade
        float fade = 1.0 - smoothstep(150.0, 280.0, abs(z));
        gl_FragColor = vec4(color, fade * 0.85);
      }
    `,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
  });

  shardMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffd700,
    emissive: 0xffa500,
    emissiveIntensity: 0.8,
    metalness: 0.8,
    roughness: 0.2,
    envMap: envMap,
    envMapIntensity: 2.0,
    flatShading: true,
  });

  gateMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x00ff88,
    emissive: 0x00ff88,
    emissiveIntensity: 0.6,
    metalness: 0.3,
    roughness: 0.1,
    transmission: 0.5,
    transparent: true,
    opacity: 0.7,
    envMap: envMap,
    flatShading: true,
    side: THREE.DoubleSide,
  });
}

// ═══════════════════════════════════════════
// TUNNEL GENERATION
// ═══════════════════════════════════════════
function getTunnelCurve(z) {
  // Use absolute z for curve so segments stay consistent
  const absZ = Math.abs(z);
  const amp = 0.5 + absZ * 0.0003;
  const x = Math.sin(z * 0.008) * amp * 4 + Math.sin(z * 0.023) * amp * 1.5;
  const y = Math.cos(z * 0.012) * amp * 2.5 + Math.sin(z * 0.031) * amp;
  return { x, y };
}

function createTunnelSegment(zStart) {
  const sides = 8;
  const lengthSegs = 3;
  const vertices = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  for (let lz = 0; lz <= lengthSegs; lz++) {
    const z = zStart - (lz / lengthSegs) * SEGMENT_LENGTH;
    const center = getTunnelCurve(z);
    for (let s = 0; s <= sides; s++) {
      const angle = (s / sides) * Math.PI * 2;
      const px = center.x + Math.cos(angle) * TUNNEL_RADIUS;
      const py = center.y + Math.sin(angle) * TUNNEL_RADIUS;
      vertices.push(px, py, z);
      const nx = Math.cos(angle);
      const ny = Math.sin(angle);
      normals.push(-nx, -ny, 0);
      uvs.push(s / sides, lz / lengthSegs);
    }
  }

  for (let lz = 0; lz < lengthSegs; lz++) {
    for (let s = 0; s < sides; s++) {
      const a = lz * (sides + 1) + s;
      const b = a + 1;
      const c = a + (sides + 1);
      const d = c + 1;
      indices.push(a, c, b);
      indices.push(b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);

  const mesh = new THREE.Mesh(geo, tunnelMaterial);
  mesh.userData.zStart = zStart;
  mesh.userData.zEnd = zStart - SEGMENT_LENGTH;
  mesh.frustumCulled = false;
  return mesh;
}

// ═══════════════════════════════════════════
// OBSTACLES
// ═══════════════════════════════════════════
const obstacleGeometries = [];
function initObstacleGeos() {
  obstacleGeometries.push(new THREE.IcosahedronGeometry(0.8, 0));
  obstacleGeometries.push(new THREE.OctahedronGeometry(0.9, 0));
  obstacleGeometries.push(new THREE.TetrahedronGeometry(1.0, 0));
  obstacleGeometries.push(new THREE.TorusGeometry(0.7, 0.25, 4, 6));
  obstacleGeometries.push(new THREE.DodecahedronGeometry(0.75, 0));
}

function createObstacleMaterial(zone) {
  const zc = State.zoneColors[zone % State.zoneColors.length];
  return new THREE.MeshPhysicalMaterial({
    color: zc.primary,
    emissive: zc.secondary,
    emissiveIntensity: 0.4,
    metalness: 0.2,
    roughness: 0.1,
    transmission: 0.6,
    transparent: true,
    opacity: 0.75,
    envMap: envMap,
    envMapIntensity: 1.2,
    flatShading: true,
    side: THREE.DoubleSide,
  });
}

function spawnObstacle(z) {
  const center = getTunnelCurve(z);
  const count = 1 + Math.floor(Math.random() * (2 + State.zone * 0.5));
  const geoIdx = Math.floor(Math.random() * obstacleGeometries.length);

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = 1.0 + Math.random() * (TUNNEL_RADIUS - 2.0);
    const px = center.x + Math.cos(angle) * r;
    const py = center.y + Math.sin(angle) * r;

    let mesh;
    if (obstaclePool.length > 0) {
      mesh = obstaclePool.pop();
      mesh.geometry = obstacleGeometries[geoIdx];
      mesh.material = createObstacleMaterial(State.zone);
    } else {
      mesh = new THREE.Mesh(obstacleGeometries[geoIdx], createObstacleMaterial(State.zone));
    }
    mesh.position.set(px, py, z - Math.random() * 4);
    mesh.rotation.set(Math.random()*3, Math.random()*3, Math.random()*3);
    mesh.userData.rotSpeed = {
      x: (Math.random()-0.5)*2,
      y: (Math.random()-0.5)*2,
      z: (Math.random()-0.5)*2
    };
    mesh.userData.angle = angle;
    mesh.userData.radius = r;
    mesh.userData.active = true;
    mesh.visible = true;
    const sc = 0.8 + Math.random() * 0.8;
    mesh.scale.set(sc, sc, sc);
    scene.add(mesh);
    obstacles.push(mesh);
  }
}

// ═══════════════════════════════════════════
// PARTICLE SYSTEM
// ═══════════════════════════════════════════
const MAX_PARTICLES = 500;
let particlePositions, particleVelocities, particleLifetimes, particleColors;
let nextParticle = 0;

function createParticleSystem() {
  const geo = new THREE.BufferGeometry();
  particlePositions = new Float32Array(MAX_PARTICLES * 3);
  particleVelocities = new Float32Array(MAX_PARTICLES * 3);
  particleLifetimes = new Float32Array(MAX_PARTICLES); // 0 = dead
  particleColors = new Float32Array(MAX_PARTICLES * 3);

  geo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

  particleMaterial = new THREE.PointsMaterial({
    size: 0.12,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });

  particleSystem = new THREE.Points(geo, particleMaterial);
  particleSystem.frustumCulled = false;
  scene.add(particleSystem);
}

function emitParticles(pos, color, count = 15, speed = 3) {
  for (let i = 0; i < count; i++) {
    const idx = nextParticle % MAX_PARTICLES;
    nextParticle++;
    particlePositions[idx*3] = pos.x;
    particlePositions[idx*3+1] = pos.y;
    particlePositions[idx*3+2] = pos.z;
    const dir = new THREE.Vector3(
      (Math.random()-0.5)*2,
      (Math.random()-0.5)*2,
      (Math.random()-0.5)*2
    ).normalize().multiplyScalar(speed * (0.5 + Math.random()));
    particleVelocities[idx*3] = dir.x;
    particleVelocities[idx*3+1] = dir.y;
    particleVelocities[idx*3+2] = dir.z;
    particleLifetimes[idx] = 1.0;
    particleColors[idx*3] = color.r;
    particleColors[idx*3+1] = color.g;
    particleColors[idx*3+2] = color.b;
  }
}

function updateParticles(dt) {
  for (let i = 0; i < MAX_PARTICLES; i++) {
    if (particleLifetimes[i] <= 0) continue;
    particleLifetimes[i] -= dt * 2.5;
    if (particleLifetimes[i] <= 0) {
      particlePositions[i*3+1] = -9999;
      continue;
    }
    particlePositions[i*3] += particleVelocities[i*3] * dt;
    particlePositions[i*3+1] += particleVelocities[i*3+1] * dt;
    particlePositions[i*3+2] += particleVelocities[i*3+2] * dt;
    // Fade velocity
    particleVelocities[i*3] *= 0.96;
    particleVelocities[i*3+1] *= 0.96;
    particleVelocities[i*3+2] *= 0.96;
  }
  particleSystem.geometry.attributes.position.needsUpdate = true;
  particleSystem.geometry.attributes.color.needsUpdate = true;
}

// ═══════════════════════════════════════════
// WORLD GENERATION
// ═══════════════════════════════════════════
let nextSegmentZ = 0;
let nextObstacleZ = -40;
let nextPickupZ = -25;
let nextGateZ = -100;

function generateWorld() {
  // Initial tunnel segments
  for (let i = 0; i < VISIBLE_SEGMENTS; i++) {
    const seg = createTunnelSegment(nextSegmentZ);
    scene.add(seg);
    tunnelSegments.push(seg);
    nextSegmentZ -= SEGMENT_LENGTH;
  }
}

function updateWorldGeneration() {
  const playerZ = -State.distance;

  // Generate tunnel
  while (nextSegmentZ > playerZ - SPAWN_AHEAD) {
    const seg = createTunnelSegment(nextSegmentZ);
    scene.add(seg);
    tunnelSegments.push(seg);
    nextSegmentZ -= SEGMENT_LENGTH;
  }

  // Remove old segments
  while (tunnelSegments.length > 0 && tunnelSegments[0].userData.zStart > playerZ + 30) {
    const seg = tunnelSegments.shift();
    scene.remove(seg);
    seg.geometry.dispose();
  }

  // Obstacles
  const obstacleDensity = Math.max(6, 18 - State.zone * 2 - State.distance * 0.003);
  while (nextObstacleZ > playerZ - SPAWN_AHEAD) {
    spawnObstacle(nextObstacleZ);
    nextObstacleZ -= obstacleDensity + Math.random() * obstacleDensity * 0.5;
  }

  // Pickups
  const pickupRate = Math.max(5, 12 - State.zone);
  while (nextPickupZ > playerZ - SPAWN_AHEAD) {
    spawnPickup(nextPickupZ);
    nextPickupZ -= pickupRate + Math.random() * 8;
  }

  // Gates
  while (nextGateZ > playerZ - SPAWN_AHEAD) {
    spawnGate(nextGateZ);
    nextGateZ -= 80 + Math.random() * 60;
  }

  // Cleanup
  cleanupObjects(obstacles, obstaclePool, playerZ);
  cleanupObjects(pickups, pickupPool, playerZ);
  cleanupObjects(gateRings, gatePool, playerZ);
}

function cleanupObjects(arr, pool, playerZ) {
  for (let i = arr.length - 1; i >= 0; i--) {
    if (arr[i].position.z > playerZ + 40) {
      const obj = arr.splice(i, 1)[0];
      obj.visible = false;
      scene.remove(obj);
      pool.push(obj);
    }
  }
}

// ═══════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════
const input = { left: false, right: false, boost: false };
let touchStartX = 0, touchStartY = 0;
let isMobile = false;

function setupInput() {
  // Detect mobile
  isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isMobile) {
    document.getElementById('controls-hint').innerHTML = 'SWIPE LEFT/RIGHT to steer · SWIPE UP to boost';
  }

  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = true;
    if (e.code === 'Space') { input.boost = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
    if (e.code === 'Space') input.boost = false;
  });

  // Touch
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (State.phase !== 'playing') return;
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;

    if (Math.abs(dx) > 15) {
      input.left = dx < -15;
      input.right = dx > 15;
    }
    if (dy < -30) {
      input.boost = true;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    input.left = false;
    input.right = false;
    input.boost = false;
  });

  // Click particles
  document.addEventListener('click', e => {
    spawnClickParticles(e.clientX, e.clientY);
  });
}

function spawnClickParticles(x, y) {
  const colors = ['#00f0ff', '#ff00a0', '#ffd700', '#00ff88'];
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'click-particle';
    const angle = (i / 8) * Math.PI * 2;
    const dist = 20 + Math.random() * 30;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.boxShadow = `0 0 6px ${p.style.background}`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 600);
  }
}

// ═══════════════════════════════════════════
// BUTTON RIPPLE
// ═══════════════════════════════════════════
document.querySelectorAll('.glass-btn').forEach(btn => {
  btn.addEventListener('click', function(e) {
    const rect = this.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
    this.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
    audio.init();
    audio.playClick();
  });
});

// ═══════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════
function resetGame() {
  // Clear objects
  obstacles.forEach(o => { scene.remove(o); });
  pickups.forEach(o => { scene.remove(o); });
  gateRings.forEach(o => { scene.remove(o); });
  tunnelSegments.forEach(o => { scene.remove(o); o.geometry.dispose(); });
  obstacles.length = 0;
  pickups.length = 0;
  gateRings.length = 0;
  tunnelSegments.length = 0;
  obstaclePool.length = 0;
  pickupPool.length = 0;
  gatePool.length = 0;

  State.score = 0;
  State.displayScore = 0;
  State.distance = 0;
  State.shards = 0;
  State.multiplier = 1.0;
  State.speed = State.baseSpeed;
  State.boost = 1.0;
  State.boosting = false;
  State.playerAngle = 0;
  State.targetAngle = 0;
  State.invulnerable = 0;
  State.zone = 0;
  State.lastZoneChange = 0;

  nextSegmentZ = 0;
  nextObstacleZ = -40;
  nextPickupZ = -25;
  nextGateZ = -100;

  generateWorld();
  updateZoneVisuals();
}

function updatePlayer(dt) {
  // Steering
  const steerSpeed = 3.5;
  if (input.left) State.targetAngle += steerSpeed * dt;
  if (input.right) State.targetAngle -= steerSpeed * dt;

  // Smooth follow
  State.playerAngle += (State.targetAngle - State.playerAngle) * Math.min(1, dt * 10);

  // Boost
  if (input.boost && State.boost > 0) {
    State.boosting = true;
    State.boost = Math.max(0, State.boost - dt * 0.5);
    State.speed = Math.min(State.maxSpeed, State.speed + dt * 25);
  } else {
    State.boosting = false;
    State.boost = Math.min(1, State.boost + dt * 0.15);
    const targetSpeed = State.baseSpeed + State.distance * 0.008 + State.zone * 3;
    State.speed += (Math.min(targetSpeed, State.maxSpeed * 0.7) - State.speed) * dt * 0.5;
  }

  // Distance
  State.distance += State.speed * dt;

  // Score
  State.score += State.speed * State.multiplier * dt * 0.5;

  // Invulnerability
  if (State.invulnerable > 0) State.invulnerable -= dt;

  // Position player mesh
  const pz = -State.distance;
  const center = getTunnelCurve(pz);
  const px = center.x + Math.cos(State.playerAngle) * State.playerRadius;
  const py = center.y + Math.sin(State.playerAngle) * State.playerRadius;
  playerMesh.position.set(px, py, pz - 3);

  // Orientation
  const lookZ = pz - 6;
  const lookCenter = getTunnelCurve(lookZ);
  playerMesh.lookAt(lookCenter.x, lookCenter.y, lookZ);

  // Tilt based on steering
  const steerTilt = (State.targetAngle - State.playerAngle) * 2;
  playerMesh.rotation.z += steerTilt;

  // Shield effect
  if (State.invulnerable > 0) {
    shieldMesh.material.opacity = 0.3 + Math.sin(State.invulnerable * 15) * 0.2;
    shieldMesh.rotation.y += dt * 5;
    shieldMesh.rotation.x += dt * 3;
  } else {
    shieldMesh.material.opacity = 0;
  }

  // Glow pulse
  const glowMesh = playerMesh.userData.glowMesh;
  if (glowMesh) {
    const sc = State.boosting ? 1.5 + Math.sin(Date.now()*0.02) * 0.5 : 1;
    glowMesh.scale.set(sc, sc, sc);
  }

  // Engine trail particles
  if (Math.random() < 0.5) {
    const trailColor = State.boosting ? new THREE.Color(0xff00a0) : new THREE.Color(0x00f0ff);
    emitParticles(
      new THREE.Vector3(px, py, pz - 2.5),
      trailColor,
      1,
      State.boosting ? 4 : 1.5
    );
  }
}

function updateCamera(dt) {
  const pz = -State.distance;
  const center = getTunnelCurve(pz + 2);
  const lookAhead = getTunnelCurve(pz - 15);

  // Camera follows with slight offset
  const camAngle = State.playerAngle;
  const camR = State.playerRadius * 0.4;
  const camX = center.x + Math.cos(camAngle) * camR;
  const camY = center.y + Math.sin(camAngle) * camR;

  camera.position.lerp(new THREE.Vector3(camX, camY, pz + 2), Math.min(1, dt * 8));
  const lookTarget = new THREE.Vector3(lookAhead.x, lookAhead.y, pz - 15);
  camera.lookAt(lookTarget);

  // FOV boost
  const targetFov = State.boosting ? 90 : 70;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 5);
  camera.updateProjectionMatrix();
}

function checkCollisions() {
  const playerPos = playerMesh.position;
  const playerRadius = 0.6;

  // Obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const obs = obstacles[i];
    if (!obs.userData.active) continue;
    const dist = playerPos.distanceTo(obs.position);
    if (dist < playerRadius + obs.scale.x * 0.8) {
      if (State.invulnerable <= 0) {
        // HIT!
        obs.userData.active = false;
        emitParticles(obs.position, new THREE.Color(0xff3333), 30, 6);
        audio.playCrash();
        die();
        return;
      } else {
        // Shield absorb
        obs.userData.active = false;
        obs.visible = false;
        emitParticles(obs.position, new THREE.Color(0x00f0ff), 20, 4);
      }
    }
  }

  // Pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const pk = pickups[i];
    if (!pk.userData.active) continue;
    const dist = playerPos.distanceTo(pk.position);
    if (dist < playerRadius + 0.8) {
      pk.userData.active = false;
      pk.visible = false;
      State.shards++;
      State.score += 50 * State.multiplier;
      emitParticles(pk.position, new THREE.Color(0xffd700), 12, 3);
      audio.playPickup();
    }
  }

  // Gates
  for (let i = gateRings.length - 1; i >= 0; i--) {
    const gate = gateRings[i];
    if (!gate.userData.active) continue;
    if (Math.abs(playerPos.z - gate.position.z) < 1.5) {
      gate.userData.active = false;
      gate.visible = false;
      State.multiplier = Math.min(State.multiplier + 0.3, 5.0);
      State.invulnerable = 2.0;
      emitParticles(gate.position, new THREE.Color(0x00ff88), 40, 5);
      audio.playGate();
    }
  }

  // Tunnel wall collision
  const pz = -State.distance;
  const center = getTunnelCurve(pz);
  const distFromCenter = Math.sqrt(
    (playerPos.x - center.x)**2 + (playerPos.y - center.y)**2
  );
  if (distFromCenter > TUNNEL_RADIUS - 0.5) {
    if (State.invulnerable <= 0) {
      emitParticles(playerPos.clone(), new THREE.Color(0xff3333), 25, 5);
      audio.playCrash();
      die();
    }
  }
}

function die() {
  State.phase = 'dying';
  State.speed *= 0.1;
  audio.stopDrone();

  // Slow-mo effect
  setTimeout(() => {
    State.phase = 'dead';
    showGameOver();
  }, 800);
}

function updateZone() {
  const newZone = Math.floor(State.distance / 500);
  if (newZone !== State.zone && State.distance - State.lastZoneChange > 400) {
    State.zone = newZone % State.zoneNames.length;
    State.lastZoneChange = State.distance;
    updateZoneVisuals();
    showZoneIndicator(State.zoneNames[State.zone]);
  }
}

function updateZoneVisuals() {
  const zc = State.zoneColors[State.zone % State.zoneColors.length];
  tunnelMaterial.uniforms.uColor1.value.copy(zc.primary);
  tunnelMaterial.uniforms.uColor2.value.copy(zc.secondary);
  scene.fog.color.copy(zc.fog);
}

function showZoneIndicator(name) {
  const el = document.getElementById('zone-indicator');
  el.textContent = name;
  el.className = '';
  void el.offsetWidth;
  el.classList.add('show');
}

// ═══════════════════════════════════════════
// OBSTACLE ANIMATIONS
// ═══════════════════════════════════════════
function updateObstacles(dt) {
  for (const obs of obstacles) {
    if (!obs.userData.active) continue;
    obs.rotation.x += obs.userData.rotSpeed.x * dt;
    obs.rotation.y += obs.userData.rotSpeed.y * dt;
    obs.rotation.z += obs.userData.rotSpeed.z * dt;
  }
  for (const pk of pickups) {
    if (!pk.userData.active) continue;
    pk.rotation.y += dt * 2;
    pk.rotation.x += dt * 1.5;
    pk.position.y += Math.sin(Date.now() * 0.003 + pk.position.z) * dt * 0.3;
  }
  for (const gate of gateRings) {
    if (!gate.userData.active) continue;
    gate.rotation.z += dt * 0.5;
  }
}

// ═══════════════════════════════════════════
// HUD UPDATE
// ═══════════════════════════════════════════
function updateHUD() {
  // Smooth score ticker
  State.displayScore += (State.score - State.displayScore) * 0.1;
  const scoreEl = document.getElementById('hud-score');
  scoreEl.textContent = Math.floor(State.displayScore).toLocaleString();

  // Score pulse on milestones
  if (Math.floor(State.score / 10000) > Math.floor((State.score - State.speed * 0.016 * State.multiplier * 0.5) / 10000)) {
    scoreEl.classList.add('pulse');
    setTimeout(() => scoreEl.classList.remove('pulse'), 300);
  }

  document.getElementById('hud-multi').textContent = `×${State.multiplier.toFixed(1)}`;
  document.getElementById('hud-distance').textContent = `${Math.floor(State.distance)}m`;
  document.getElementById('hud-shards').textContent = `◆ ${State.shards}`;
  document.getElementById('boost-bar').style.width = `${State.boost * 100}%`;
}

// ═══════════════════════════════════════════
// SCREEN MANAGEMENT
// ═══════════════════════════════════════════
function showTitle() {
  document.getElementById('title-screen').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('boost-bar-container').classList.add('hidden');
  document.getElementById('game-over').classList.remove('visible');
  document.getElementById('high-score-title').textContent = `BEST: ${Math.floor(State.highScore).toLocaleString()}`;
}

function showGameOver() {
  const isNewBest = State.score > State.highScore;
  if (isNewBest) {
    State.highScore = Math.floor(State.score);
    localStorage.setItem('prismDriftHigh', State.highScore);
  }
  document.getElementById('go-score').textContent = Math.floor(State.score).toLocaleString();
  document.getElementById('go-distance').textContent = `${Math.floor(State.distance)}m`;
  document.getElementById('go-shards').textContent = State.shards;
  document.getElementById('go-best').textContent = Math.floor(State.highScore).toLocaleString();
  document.getElementById('new-best-badge').style.display = isNewBest ? 'block' : 'none';
  document.getElementById('game-over').classList.add('visible');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('boost-bar-container').classList.add('hidden');
}

// ═══════════════════════════════════════════
// GLOBAL GAME FUNCTIONS
// ═══════════════════════════════════════════
window.startGame = function() {
  audio.init();
  State.phase = 'playing';
  resetGame();
  document.getElementById('title-screen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('boost-bar-container').classList.remove('hidden');
  document.getElementById('game-over').classList.remove('visible');
};

window.restartGame = function() {
  audio.init();
  audio.playClick();
  State.phase = 'playing';
  resetGame();
  document.getElementById('game-over').classList.remove('visible');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('boost-bar-container').classList.remove('hidden');
};

window.goToMenu = function() {
  audio.init();
  audio.playClick();
  // Clean up game objects
  obstacles.forEach(o => { scene.remove(o); });
  pickups.forEach(o => { scene.remove(o); });
  gateRings.forEach(o => { scene.remove(o); });
  tunnelSegments.forEach(o => { scene.remove(o); o.geometry.dispose(); });
  obstacles.length = 0; pickups.length = 0; gateRings.length = 0; tunnelSegments.length = 0;
  obstaclePool.length = 0; pickupPool.length = 0; gatePool.length = 0;
  playerMesh.visible = false;
  State.phase = 'title';
  showTitle();
};

// ═══════════════════════════════════════════
// TITLE SCENE (Background animation)
// ═══════════════════════════════════════════
let titlePrisms = [];
function createTitleScene() {
  for (let i = 0; i < 30; i++) {
    const geos = [
      new THREE.IcosahedronGeometry(0.5 + Math.random(), 0),
      new THREE.OctahedronGeometry(0.5 + Math.random(), 0),
      new THREE.TetrahedronGeometry(0.6 + Math.random(), 0),
    ];
    const geo = geos[Math.floor(Math.random() * geos.length)];
    const mat = new THREE.MeshPhysicalMaterial({
      color: [0x00f0ff, 0xff00a0, 0x6633ff, 0x00ff88][Math.floor(Math.random()*4)],
      emissive: [0x00f0ff, 0xff00a0][Math.floor(Math.random()*2)],
      emissiveIntensity: 0.3,
      metalness: 0.2,
      roughness: 0.1,
      transmission: 0.7,
      transparent: true,
      opacity: 0.5,
      envMap: envMap,
      flatShading: true,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random()-0.5) * 30,
      (Math.random()-0.5) * 20,
      -10 - Math.random() * 40
    );
    mesh.userData.rotSpeed = {
      x: (Math.random()-0.5)*0.5,
      y: (Math.random()-0.5)*0.5,
      z: (Math.random()-0.5)*0.3
    };
    mesh.userData.floatSpeed = 0.3 + Math.random() * 0.5;
    mesh.userData.floatOffset = Math.random() * Math.PI * 2;
    mesh.userData.baseY = mesh.position.y;
    scene.add(mesh);
    titlePrisms.push(mesh);
  }
}

function updateTitleScene(time) {
  for (const p of titlePrisms) {
    p.rotation.x += p.userData.rotSpeed.x * 0.016;
    p.rotation.y += p.userData.rotSpeed.y * 0.016;
    p.rotation.z += p.userData.rotSpeed.z * 0.016;
    p.position.y = p.userData.baseY + Math.sin(time * p.userData.floatSpeed + p.userData.floatOffset) * 0.5;
  }
  camera.position.set(
    Math.sin(time * 0.1) * 2,
    Math.cos(time * 0.08) * 1,
    5
  );
  camera.lookAt(0, 0, -15);
}

function clearTitleScene() {
  for (const p of titlePrisms) {
    scene.remove(p);
    p.geometry.dispose();
    p.material.dispose();
  }
  titlePrisms.length = 0;
}

// ═══════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  if (State.phase === 'title' || State.phase === 'dead') {
    if (titlePrisms.length === 0) {
      createTitleScene();
    }
    updateTitleScene(time);
  }

  if (State.phase === 'playing' || State.phase === 'dying') {
    if (titlePrisms.length > 0) clearTitleScene();

    const speedMult = State.phase === 'dying' ? 0.05 : 1;

    // Update game
    if (State.phase === 'playing') {
      updatePlayer(dt * speedMult);
      checkCollisions();
      updateZone();
    } else {
      // Dying slow-mo
      State.distance += State.speed * dt * speedMult;
      const pz = -State.distance;
      const center = getTunnelCurve(pz);
      playerMesh.position.x = center.x + Math.cos(State.playerAngle) * State.playerRadius;
      playerMesh.position.y = center.y + Math.sin(State.playerAngle) * State.playerRadius;
      playerMesh.position.z = pz - 3;
    }

    updateCamera(dt);
    updateWorldGeneration();
    updateObstacles(dt * speedMult);
    updateHUD();

    // Update shader uniforms
    tunnelMaterial.uniforms.uTime.value = time;
    tunnelMaterial.uniforms.uSpeed.value = State.speed;
    tunnelMaterial.uniforms.uPlayerZ.value = -State.distance;

    // Audio drone
    const speedFraction = (State.speed - State.baseSpeed) / (State.maxSpeed - State.baseSpeed);
    audio.setDroneIntensity(speedFraction);

    // Post-processing intensity
    bloomPass.strength = 0.6 + (State.boosting ? 0.6 : 0) + State.zone * 0.05;
    if (window._vignettePass) {
      window._vignettePass.uniforms.chromaticAberration.value =
        State.boosting ? 0.008 : 0.002 + speedFraction * 0.003;
    }

    // Stars follow
    if (window._stars) {
      window._stars.position.z = -State.distance;
    }
  }

  updateParticles(dt);
  composer.render();
}

// ═══════════════════════════════════════════
// INITIALIZATION
// ═══════════════════════════════════════════
async function init() {
  const fill = document.getElementById('loading-fill');

  fill.style.width = '20%';
  initRenderer();
  await new Promise(r => setTimeout(r, 100));

  fill.style.width = '40%';
  createMaterials();
  initObstacleGeos();
  await new Promise(r => setTimeout(r, 100));

  fill.style.width = '60%';
  setupScene();
  createParticleSystem();
  await new Promise(r => setTimeout(r, 100));

  fill.style.width = '80%';
  playerMesh = createPlayer();
  scene.add(playerMesh);
  playerMesh.visible = false;
  setupInput();
  await new Promise(r => setTimeout(r, 100));

  fill.style.width = '100%';
  await new Promise(r => setTimeout(r, 300));

  // Hide loading, show title
  document.getElementById('loading-screen').classList.add('fade-out');
  setTimeout(() => {
    document.getElementById('loading-screen').style.display = 'none';
  }, 800);

  State.phase = 'title';
  showTitle();
  animate();
}

// Override startGame to also show player mesh
const _origStart = window.startGame;
window.startGame = function() {
  _origStart();
  playerMesh.visible = true;
};

const _origRestart = window.restartGame;
window.restartGame = function() {
  _origRestart();
  playerMesh.visible = true;
};

init();

</script>
